baseURL = "https://Cata-3.github.io/myblog/"
title = "My Blog"
theme = "PaperMod"
locale = "en"
enableEmoji = true
hasCJKLanguage = true
enableGitInfo = true

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  mainSections = ["posts", "notes"]
  ShowAllPagesInArchive = true
  subtitle = "My Blog"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowViews = true
  githubRepo = "https://github.com/Cata-3/myblog"
  DateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "Hi there 👋"
    Content = "Good morning, welcome to my blog."

[[menu.main]]
  identifier = "home"
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menu.main]]
  identifier = "note"
  name = "Notes"
  url = "/notes/"
  weight = 3

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 4

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 5
[frontmatter]
  lastmod = [':git', 'lastmod', 'date']
  date = ['date', ':git', 'publishDate']
