{{- if and .IsPage (.Param "ShowViews") }}
<span class="goatcounter-views meta-item" data-path="{{ .RelPermalink | strings.TrimSuffix "/" }}">Loading...</span>
<script>
  (function() {
    var els = document.querySelectorAll('.goatcounter-views:not(.loaded)');
    els.forEach(function(el) {
      el.classList.add('loaded');
      var path = el.getAttribute('data-path');
      var url = 'https://cata3.goatcounter.com/counter' + path + '.json';

      fetch(url)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var count = data.count_unique || data.count || 0;
          el.innerText = count + ' views';
        })
        .catch(function() {
          el.innerText = '0 views';
        });
    });
  })();
</script>
{{- end }}
