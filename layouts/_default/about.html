{{- define "main" }}
<article class="about-page">

  <header class="about-header">
    <img class="about-avatar" src="{{ "avatar.jpg" | relURL }}" alt="avatar">
    <div class="about-intro">
      <h1 class="about-name">Catta</h1>
      <p class="about-tagline">UOE, Mathematical Physics</p>
    </div>
  </header>

  <div class="about-content">
    {{ .Content }}
  </div>

</article>

<style>
.about-page {
  max-width: 640px;
  margin: 0 auto;
  padding: 2rem 1rem 4rem;
  font-family: "Iowan Old Style", Georgia, "Songti SC", "STSong", "STFangsong", serif;
  font-size: 16px;
  line-height: 1.6;
}
.about-header {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 2rem;
}
.about-avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.about-intro { flex: 1; min-width: 0; }
.about-name {
  margin: 0 0 0.2rem;
  font-size: 1.4rem;
  line-height: 1.2;
}
.about-tagline {
  color: var(--secondary);
  margin: 0;
  font-size: 0.95rem;
}
.about-content h2 {
  font-size: 1.05rem;
  margin-top: 1.5rem;
  margin-bottom: 0.3rem;
  font-weight: 600;
}
.about-content p {
  margin: 0.3rem 0;
}
.about-content a,
.about-content a:visited {
  color: #0366d6 !important;
  text-decoration: underline !important;
}
.about-content a:hover {
  color: #024a9e !important;
}
@media (max-width: 600px) {
  .about-header {
    flex-direction: column;
    text-align: center;
  }
}
</style>
{{- end }}
